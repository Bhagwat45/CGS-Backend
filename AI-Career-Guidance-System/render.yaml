services:
  - type: web
    name: ai-career-guidance-api
    runtime: docker
    plan: free
    dockerfilePath: ./AI-Career-Guidance-System/backend/Dockerfile
    dockerContext: ./AI-Career-Guidance-System
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: career_guidance_db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: FRONTEND_URL
        sync: false